<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Christophers Apps</title>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--pan:#151922;--line:#2a3142;--ink:#f3f1ea;--mut:#9aa3b2;--gold:#e9c46a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(120% 70% at 50% -10%,#2a2f45 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
main{width:100%;max-width:440px}
h1{font-size:34px;line-height:1.1;margin:0 0 6px}
p{color:var(--mut);margin:0 0 22px}
a.app{display:flex;align-items:center;gap:16px;background:var(--pan);border:1px solid var(--line);border-radius:16px;padding:18px;color:inherit;text-decoration:none;margin-bottom:12px;min-height:44px}
a.app:hover,a.app:focus-visible{border-color:var(--gold);outline:none}
.ic{flex:none;width:52px;height:52px;border-radius:14px;overflow:hidden;display:grid;place-items:center}
.ic img{width:100%;height:100%;object-fit:cover}
b{display:block;font-size:19px}
span{color:var(--mut);font-size:14px}
footer{color:var(--mut);font-size:13px;text-align:center;margin-top:18px}
</style>
</head>
<body>
<main>
<h1>Christophers Apps</h1>
<p>Wähle eine App. In Chrome kannst du jede App über das Menü als eigene App installieren.</p>
<a class="app" href="alltag/">
 <div class="ic"><img src="alltag/icon-192.png" alt=""></div>
 <div><b>Alltag</b><span>Kalender, To-Dos, Einkauf, Ablesungen, Tresor</span></div>
</a>
<a class="app" href="darts/">
 <div class="ic"><img src="darts/icon-192.png" alt=""></div>
 <div><b>Darts Karriere</b><span>Darts-Spiel im FIFA-Stil</span></div>
</a>
<footer>Gehostet mit GitHub Pages</footer>
</main>
<script>
// Alte Service-Worker-Registrierung aus dem Hauptordner entfernen (Alltag liegt jetzt in /alltag/)
try{navigator.serviceWorker&&navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{if(r.scope===location.origin+"/")r.unregister()}))}catch(e){}
</script>
</body>
</html>
