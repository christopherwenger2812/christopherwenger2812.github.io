<style>
/* VOICE: TV-Darts-Gala am Samstagabend,laut,golden,Bühnenlicht
   IDEA: Ultimate-Spielerkarte trifft TV-Scoreboard einer Darts-WM
   PICTURE: das Dartboard selbst,groß im Spotlight
   COLOUR and TYPE: Bühnenschwarz,Board-Rot und -Grün,Kartengold; Oswald + Inter
   LAYOUT: eine Spalte,Phone-first,Scoreboard oben,Board mittig,Darts unten */
:root{color-scheme:dark;--bg:#0b0d12;--pan:#151922;--pan2:#1d2230;--line:#2a3142;--gold:#e9c46a;--gold2:#b8862b;--red:#d62839;--green:#12a150;--ink:#f3f1ea;--mut:#9aa3b2;--cy:#5fd3f3}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(120% 70% at 50% -10%,#2a2f45 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1,h2,h3,.os{font-family:Oswald,Impact,sans-serif;letter-spacing:.01em;margin:0;line-height:1.05}
h1{font-size:44px;text-wrap:balance}h2{font-size:28px}h3{font-size:20px}
.mut{color:var(--mut)}.small{font-size:13px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:0;border-radius:12px;background:var(--pan2);color:var(--ink);font:600 16px Inter,sans-serif;padding:10px 16px;cursor:pointer;border:1px solid var(--line);text-align:center}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.pri{background:linear-gradient(180deg,#f3d27e,var(--gold2));color:#1b1405;border:0;font-weight:800}
.btn.red{background:var(--red);border:0}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px}.row>*{flex:1}
.stack>*+*{margin-top:10px}
.panel{background:var(--pan);border:1px solid var(--line);border-radius:16px;padding:14px}
input,select{width:100%;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--pan2);color:var(--ink);font:16px Inter,sans-serif;padding:0 12px}
label{display:block;font-weight:600;margin:0 0 6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.back{width:auto;min-height:44px;padding:0 14px}
.coins{font-weight:800;color:var(--gold);white-space:nowrap}
/* Spielerkarte */
.card{position:relative;width:240px;margin:6px auto 4px;aspect-ratio:3/4.3;padding:22px 18px 18px;color:#2a1d04;
 background:radial-gradient(90% 60% at 30% 10%,#fff3c4 0%,transparent 60%),linear-gradient(160deg,#f7dd8f,#d5a742 55%,#a8761f);
 clip-path:polygon(50% 0,100% 7%,100% 88%,50% 100%,0 88%,0 7%);filter:drop-shadow(0 10px 24px rgba(233,196,106,.25))}
.card.silver{background:radial-gradient(90% 60% at 30% 10%,#fff 0%,transparent 60%),linear-gradient(160deg,#e9edf2,#aeb6c2 55%,#7d8796)}
.card.bronze{background:radial-gradient(90% 60% at 30% 10%,#ffe0c2 0%,transparent 60%),linear-gradient(160deg,#e6b38a,#b07444 55%,#7d4a24)}
.card .ovr{font:700 52px/0.9 Oswald,sans-serif}.card .pos{font:700 16px Oswald,sans-serif;margin-top:4px}
.card .nat{font:700 14px 'Barlow Condensed','Roboto Condensed',sans-serif-condensed,'Arial Narrow',Oswald,Impact,'Arial Narrow',sans-serif;border:2px solid currentColor;display:inline-block;padding:0 5px;border-radius:4px;margin-top:6px}
.card .nm{font:700 24px Oswald,sans-serif;text-align:center;margin-top:24px;border-bottom:1px solid rgba(42,29,4,.35);padding-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .nick{text-align:center;font-size:12px;font-weight:600;opacity:.8;margin-top:2px}
.card .st{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;margin:8px 6px 0;font:700 17px Oswald,sans-serif}
.card .st span b{display:inline-block;width:30px}
/* Liste */
.list{display:grid;gap:8px}
.it{display:flex;align-items:center;gap:12px;background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.it .g{flex:1}.it .num{font:700 22px 'Barlow Condensed','Roboto Condensed',sans-serif-condensed,'Arial Narrow',Oswald,Impact,'Arial Narrow',sans-serif;min-width:40px;text-align:center}
.badge{font:700 12px Inter;padding:3px 8px;border-radius:99px;background:var(--pan2);border:1px solid var(--line);white-space:nowrap}
.badge.g{background:var(--gold);color:#1b1405;border:0}.badge.r{background:var(--red);border:0}.badge.gr{background:var(--green);border:0}
.bar{height:8px;border-radius:9px;background:var(--pan2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold))}
/* Match */
.sb{display:grid;gap:4px;margin-bottom:8px}
.pl{display:grid;grid-template-columns:8px minmax(0,1fr) 34px 74px;align-items:center;gap:8px;background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:6px 10px 6px 0;overflow:hidden}
.pl .tag{height:100%;align-self:stretch;background:transparent}
.pl.on{border-color:var(--gold)}.pl.on .tag{background:var(--gold)}
.pl .n{font:700 17px 'Barlow Condensed','Roboto Condensed',sans-serif-condensed,'Arial Narrow',Oswald,Impact,'Arial Narrow',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .s{font-size:12px;color:var(--mut);white-space:nowrap}
.pl .lg{font:700 22px 'Barlow Condensed','Roboto Condensed',sans-serif-condensed,'Arial Narrow',Oswald,Impact,'Arial Narrow',sans-serif;text-align:center;background:var(--pan2);border-radius:6px}
.pl .rm{font:700 34px/1 'Barlow Condensed','Roboto Condensed',sans-serif-condensed,'Arial Narrow',Oswald,Impact,'Arial Narrow',sans-serif;text-align:right;font-variant-numeric:tabular-nums}
.pl.on .rm{color:var(--gold)}
.cmt{min-height:28px;text-align:center;font:700 20px 'Barlow Condensed','Roboto Condensed',sans-serif-condensed,'Arial Narrow',Oswald,Impact,'Arial Narrow',sans-serif;color:var(--gold);transition:transform .2s}
.cmt.pop{animation:pop .9s ease}
@keyframes pop{0%{transform:scale(.6);opacity:0}30%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}
.fig{position:relative;width:100%;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none}
.fig canvas{position:absolute;inset:0;width:100%;height:100%}
.drts{display:grid;grid-template-columns:repeat(3,1fr) 1.2fr;gap:6px;margin-top:8px}
.drts div{background:var(--pan);border:1px solid var(--line);border-radius:10px;text-align:center;padding:6px 2px;font:700 20px 'Barlow Condensed','Roboto Condensed',sans-serif-condensed,'Arial Narrow',Oswald,Impact,'Arial Narrow',sans-serif;min-height:44px}
.drts .tot{color:var(--gold)}
.hint{text-align:center;font-size:14px;color:var(--mut);min-height:22px;margin-top:6px}
.hint b{color:var(--ink)}
/* Bracket */
.rd{margin-bottom:14px}.mt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px}
.mt .w{font-weight:800}.mt .l{color:var(--mut);text-decoration:line-through}.mt .me{color:var(--gold)}
.mt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(5,6,10,.82);display:flex;align-items:center;justify-content:center;z-index:9;padding:20px}
.modal .box{max-width:380px;width:100%;text-align:center}
.flip{animation:flip .9s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{0%{transform:rotateY(90deg) scale(.6)}60%{transform:rotateY(-10deg) scale(1.05)}100%{transform:none}}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:18px 0 6px}
.hero svg{width:min(78vw,300px);height:auto;filter:drop-shadow(0 20px 40px rgba(0,0,0,.6))}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.kv b{display:block;font:700 22px 'Barlow Condensed','Roboto Condensed',sans-serif-condensed,'Arial Narrow',Oswald,Impact,'Arial Narrow',sans-serif}.kv span{font-size:12px;color:var(--mut)}
/* Halle */
.stage{position:relative;border-radius:20px;padding:30px 18px 70px;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,var(--vl) 0%,transparent 55%),linear-gradient(180deg,var(--v1),var(--v2));isolation:isolate}
.stage .beams{position:absolute;inset:-40%;z-index:-1;background:conic-gradient(from 200deg at 20% 0%,transparent 0 8deg,color-mix(in srgb,var(--vl) 28%,transparent) 10deg,transparent 16deg 360deg),conic-gradient(from 140deg at 80% 0%,transparent 0 8deg,color-mix(in srgb,var(--vl) 28%,transparent) 10deg,transparent 16deg 360deg);animation:sweep 7s ease-in-out infinite alternate;opacity:var(--vb)}
@keyframes sweep{to{transform:rotate(9deg) translateX(4%)}}
.stage .crowd{position:absolute;left:0;right:0;bottom:0;height:30%;z-index:-1;opacity:var(--vc)}
.stage .fig{max-width:440px;margin:0 auto;filter:drop-shadow(0 14px 30px rgba(0,0,0,.7))}
.stage .vname{position:absolute;left:14px;top:10px;font:700 12px Inter;color:rgba(255,255,255,.75);z-index:2;pointer-events:none}
.stage.roar .crowd{animation:jump .35s ease-in-out 4 alternate}.stage.roar .beams{animation:flash .18s 6 alternate;opacity:1}
@keyframes jump{to{transform:translateY(-6%)}}@keyframes flash{to{filter:brightness(2.2)}}
.ctxt{min-height:20px;text-align:center;font:600 14px Inter;color:var(--mut);font-style:italic}.ctxt.pop{animation:pop .9s ease}
.stage.hush{filter:brightness(.7) saturate(.6)}.stage.hush .crowd{opacity:.2}
.lstat{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(10,12,18,.94);border:1px solid var(--gold);border-radius:14px;padding:12px 16px;z-index:5;display:none;min-width:260px;text-align:center}.lstat.on{display:block;animation:pop .5s ease}
.lstat .row>*{flex:0 0 auto}
/* Walk-on */
.walk{position:fixed;inset:0;z-index:30;overflow:hidden;background:radial-gradient(90% 60% at 50% 0%,var(--wc) 0%,transparent 60%),#05060a;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fff}
.walk canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.walk>*:not(canvas){position:relative;z-index:1}
.walk .ann{font:600 15px Inter;opacity:.8;letter-spacing:.02em}
.walk .big{font:700 clamp(40px,12vw,64px)/1 'Barlow Condensed','Roboto Condensed',sans-serif-condensed,'Arial Narrow',Oswald,Impact,sans-serif;text-shadow:0 0 30px var(--wc);margin:6px 0}
.walk .song{font:600 15px Inter;margin-top:8px;opacity:.9}
.walk .chant{font:700 20px 'Barlow Condensed','Roboto Condensed',sans-serif-condensed,'Arial Narrow',Oswald,Impact,'Arial Narrow',sans-serif;color:var(--wc);margin-top:10px;white-space:nowrap;animation:chant 1s ease-in-out infinite alternate}
@keyframes chant{to{transform:scale(1.08)}}
.walk .skip{position:absolute;right:14px;top:14px;width:auto;z-index:2}
.walk .card{animation:walkin 1.1s cubic-bezier(.2,.9,.2,1)}
@keyframes walkin{0%{transform:translateY(60vh) rotateY(180deg) scale(.4);opacity:0}70%{transform:translateY(-4%) rotateY(-8deg) scale(1.06);opacity:1}100%{transform:none}}
.walk .in{animation:pop .8s ease}
.card.totw{background:radial-gradient(90% 60% at 30% 10%,#5a4a1a 0%,transparent 60%),linear-gradient(160deg,#2b2b2b,#0e0e0e 55%,#3a2c0a);color:#f2d27a}.card.totw .nm{border-color:rgba(242,210,122,.4)}
.card.hero{background:radial-gradient(90% 60% at 30% 10%,#c6a3ff 0%,transparent 60%),linear-gradient(160deg,#7b3fe4,#2b0f6b 60%,#5b2bb8);color:#fff}.card.hero .nm{border-color:rgba(255,255,255,.35)}
.card.icon{background:radial-gradient(90% 60% at 30% 10%,#fff 0%,transparent 60%),linear-gradient(160deg,#fffdf5,#efe3c2 55%,#c9a24a);color:#2a1d04;filter:drop-shadow(0 0 22px rgba(255,240,190,.45))}
.rp{animation:land .5s cubic-bezier(.2,.8,.2,1) both}@keyframes land{0%{opacity:0;transform:translateY(60px) scale(2.2)}100%{opacity:1;transform:none}}
.rchip{display:inline-block;margin:4px 3px 0;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--pan2);color:var(--ink);font:600 13px Inter;cursor:pointer}.rchip.on{background:var(--gold);color:#1b1405;border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips .btn{width:auto;flex:1 1 auto;min-height:44px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:380px){h1{font-size:36px}.pl .rm{font-size:28px}.pl{grid-template-columns:8px minmax(0,1fr) 30px 60px}}
/* ===== Redesign v9: "Matchday" — TV-Studio,Oche-Rot,Kartengold ===== */
:root{--bg:#07090e;--pan:#0f131d;--pan2:#171c29;--line:#262d3e;--gold:#f2c94c;--gold2:#c9932b;--acc:#ff3d57;--acc2:#c8102e;--red:#ff3d57;--green:#22c55e;--ink:#f5f7fb;--mut:#8f99ad;--cy:#38d6ff}
html,body{background:radial-gradient(80% 45% at 10% -5%,rgba(255,61,87,.20),transparent 60%),radial-gradient(70% 40% at 100% 0%,rgba(56,214,255,.14),transparent 60%),repeating-linear-gradient(135deg,rgba(255,255,255,.012) 0 2px,transparent 2px 9px),var(--bg) fixed;font-family:Inter,system-ui,sans-serif}
h1,h2,h3,.os{font-family:'Barlow Condensed','Roboto Condensed',sans-serif-condensed,'Arial Narrow',Oswald,Impact,sans-serif;font-weight:800;letter-spacing:.01em;text-transform:uppercase}
h1{font-size:46px}h2{font-size:28px}h3{font-size:21px}

.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,#ff5a6f,var(--acc2));color:#fff;box-shadow:0 6px 18px rgba(255,61,87,.28),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.red{background:#3a121a;border:1px solid #7a2232;color:#ffb3bd}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--cy)}
.panel{background:linear-gradient(180deg,rgba(26,32,48,.85),rgba(14,18,28,.92));border:1px solid var(--line);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 10px 30px rgba(0,0,0,.25)}
.it{background:linear-gradient(180deg,#141a27,#0f131d);border-radius:14px}
.badge{background:#1a2030;border-color:#2c3448}.badge.g{background:var(--gold);color:#1b1405}.badge.gr{background:#14532d;color:#bbf7d0;border:0}.badge.r{background:var(--acc)}
.bar{height:7px;background:#1a2030}.bar i{background:linear-gradient(90deg,var(--acc),#ff9a5a)}
input,select{background:#121725;border-radius:12px}
.top{position:sticky;top:0;z-index:4;margin:-12px -14px 12px;padding:10px 14px;background:rgba(7,9,14,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.05)}
.top h2{font-size:24px}

.coins{background:#1a1608;border:1px solid #5a4613;padding:5px 10px;border-radius:99px;font-size:14px}

 -webkit-mask-image:linear-gradient(180deg,#000 75%,transparent);mask-image:linear-gradient(180deg,#000 75%,transparent)}

function help(){show(`${topBar('Anleitung',S?'hub':'home')}
 <div class="panel stack"><p><b>Zielen:</b> Leg den Finger aufs Board. Das Fadenkreuz erscheint etwas über deinem Finger, die Lupe zeigt das Zielfeld vergrößert.</p>
 <p><b>Werfen:</b> Der Ring um das Fadenkreuz zieht sich zusammen und geht wieder auf. Lass los, wenn er grün und eng ist („Perfekt!“). Hältst du länger als 3 Sekunden, wird die Hand zittrig.</p>
 <p><b>501, Double-Out:</b> Runter auf genau 0, der letzte Dart muss ein Doppel oder das Bull sein. Überwirfst du, zählt die Aufnahme nicht (Bust).</p>
 <p><b>Saison:</b> 24 Wochen. Jede Woche wählst du eines der Turniere, für die du spielberechtigt bist. Die anderen laufen ohne dich.</p>
 <p><b>Karriere:</b> Unter 16 spielst du Junior-Tour, Jugend- und Lokalturniere. Die Tour Card gibt es über die Q-School (Halbfinale), die Top 2 der Challenge-Rangliste oder die Top 2 der Development-Rangliste.</p>
 <p><b>Nachwuchs:</b> Von 10 bis 17 spielst du die Junior-Tour mit eigener Rangliste. Die Top 16 spielen die Super 16, die Top 32 die Junior-WM, deren Finale auf der WM-Bühne läuft. Die Akademie gibt dir ein Extra-Training pro Woche. Ab 16 kommen Development Tour (bis 23) und Q-School dazu. Die Challenge Tour ist nur für Q-School-Teilnehmer.</p>
 <p><b>Amateure:</b> Die 4 Amateur-Turniere deines Landes (ab 16, ohne Tour Card) zählen für die nationale Amateur-Rangliste. Die Top 2 spielen die Amateur-WM. Landesmeister, Amateur-Weltmeister und die Nummer 1 der Rangliste bekommen einen Freiplatz für die Q-School. Die Top 4 bekommen einen Freiplatz bei Euro-Tour-Events in deinem Land. Die Landesmeisterschaft bringt zusätzlich Punkte für deine Partner-Tour. Das Preisgeld wächst mit deinem OVR. Ab 3 lokalen Titeln bist du Lokalmatador: mehr Unterstützung bei Heimspielen und bis zu 30 % bessere Sponsorenangebote.</p>
 <p><b>Jugend:</b> Es gibt die Altersklassen U11 (8–10), U13 (11–12), U15 (13–14) und U18 (15–17). Jede hat eine lokale Stadtmeisterschaft, 2 nationale Jugend-Cups, eine Kontinentalmeisterschaft und eine Jugend-WM für die Besten der Altersklasse. Die Turniere tragen Namen in der Sprache deines Landes. Alle Jugend-Turniere zählen für die Junior-Rangliste.</p>
 <p><b>Partner-Touren:</b> In vielen Regionen gibt es eine eigene Tour mit 6 Events, z. B. die Super-Liga DACH, die Nordic & Baltic Tour oder die Asien-Tour. Die Besten ohne Tour Card bekommen einen WM-Startplatz.</p>
 <p><b>Spielerinnen:</b> Spielerinnen spielen alle offenen Turniere und zusätzlich die Frauen-Serie. Die Top 8 der Frauen-Rangliste spielen das Frauen-Matchplay, die Siegerin fährt zu Grand Slam und WM, die Top 2 der Rangliste ebenfalls zur WM.</p>
 <p><b>Ausbullen:</b> Vor jedem Match wirft jeder einen Dart aufs Bull. Wer näher dran ist, beginnt das erste Leg, danach wird abgewechselt.</p>
 <p><b>Münzen:</b> Für Startgeld und Reisekosten, für Coach, Physio und Trainingslager, für Dart-Sets, Flights und Packs.</p>
 <p><b>Werte:</b> ${STATS.map(s=>`${s[2]}: ${s[3]}`).join('. ')}.</p></div>`)}

 const[a,b]=M.bull.d;later(()=>{if(((a<=6.35&&b<=6.35)||Math.abs(a-b)<1)&&(M.bullN=(M.bullN||0)+1)<3){say('Gleich nah! Nochmal ausbullen',1);M.bull={d:[null,null]};M.marks=[];M.busy=false;M.cur=c;bullTurn();return}

const COLK=/^(shirt|fl|col|c1|c2|color|fls)$/,HEX=/^#[0-9a-fA-F]{3,8}$/,BADK=new Set(['__proto__','constructor','prototype']);
function cleanStr(s){return String(s).replace(/[<>"`\\]/g,'').replace(/javascript:/gi,'').slice(0,400)}
function sanitizeSave(o,k,d){d=d||0;if(d>12)return null;if(o==null)return o;const t=typeof o;
 if(t==='string')return COLK.test(k||'')?(HEX.test(o)?o:'#c8102e'):cleanStr(o);
 if(t==='number')return isFinite(o)?o:0;if(t==='boolean')return o;
 if(Array.isArray(o)){const a=o.slice(0,5000).map(v=>sanitizeSave(v,k,d+1));return k==='fls'?a.filter(c=>HEX.test(c)):a}
 if(t==='object'){const r={};for(const key of Object.keys(o)){if(BADK.has(key))continue;r[cleanStr(key).slice(0,60)]=sanitizeSave(o[key],key,d+1)}return r}return null}
async function unzipCapped(u8,max){const rd=new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate')).getReader(),dec=new TextDecoder();let out='',n=0;
 for(;;){const{done,value}=await rd.read();if(done)break;n+=value.length;if(n>max){try{rd.cancel()}catch(e){}throw new Error('Der Spielstand ist unrealistisch groß und wurde aus Sicherheitsgründen abgelehnt.')}out+=dec.decode(value,{stream:true})}return out+dec.decode()}
